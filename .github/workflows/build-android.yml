name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  VERSION: '2.3.9'
  SRC_ARCHIVE_URL: 'https://github.com/tall-1997/daidai-panel-android/releases/download/v1.0.0-src/daidai-panel-src.tar.gz'

jobs:
  build-go-server:
    name: Build Go Server (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        run: |
          curl -L "${{ env.SRC_ARCHIVE_URL }}" -o src.tar.gz
          mkdir -p workspace
          tar xzf src.tar.gz -C workspace
          ls workspace/

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build daidai-server for arm64
        working-directory: workspace/server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go mod download
          go build -trimpath -ldflags="-s -w -X daidai-panel/handler.Version=${{ env.VERSION }}" \
            -o daidai-server .

      - name: Build ddp CLI for arm64
        working-directory: workspace/server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o ddp ./cmd/ddp

      - name: Upload Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: |
            workspace/server/daidai-server
            workspace/server/ddp

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        run: |
          curl -L "${{ env.SRC_ARCHIVE_URL }}" -o src.tar.gz
          mkdir -p workspace
          tar xzf src.tar.gz -C workspace

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: workspace/web
        run: npm ci

      - name: Build frontend
        working-directory: workspace/web
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: workspace/web/dist/

  package-runtimes:
    name: Package Termux Runtimes
    runs-on: ubuntu-latest
    steps:
      - name: Install dpkg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev patchelf

      - name: Download and extract Termux packages
        run: |
          mkdir -p runtime/termux-prefix
          cd runtime

          # Download the Packages index
          curl -sL "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" | \
            gunzip > Packages

          # Function to download a package and extract it
          download_pkg() {
            local pkgname=$1
            local filename=$(awk -v pkg="$pkgname" '
              /^Package: / { p=$2 }
              /^Filename: / { if (p==pkg) print $2 }
            ' Packages)
            if [ -n "$filename" ]; then
              local base=$(basename "$filename")
              if [ ! -f "$base" ]; then
                echo "  Downloading $pkgname..."
                curl -sL "https://packages.termux.dev/apt/termux-main/$filename" -o "$base"
              fi
              dpkg-deb -x "$base" termux-prefix/
            else
              echo "  WARNING: Package $pkgname not found in index"
            fi
          }

          # Download and extract all needed packages in dependency order
          for pkg in \
            libandroid-support \
            libc++ \
            ndk-sysroot \
            termux-exec \
            ca-certificates \
            libbz2 \
            libexpat \
            libffi \
            liblzma \
            libsqlite \
            libssl3 \
            libuuid \
            libxml2 \
            zlib \
            readline \
            sqlite \
            tcl \
            python \
            nodejs \
            bash \
            coreutils \
            findutils \
            grep \
            sed \
            tar \
            gzip \
            gawk \
            which; do
            download_pkg "$pkg"
          done

          echo "=== Extracted packages ==="
          ls -la termux-prefix/
          ls termux-prefix/usr/bin/ 2>/dev/null | head -30

      - name: Optimize runtime size
        run: |
          cd runtime/termux-prefix
          rm -rf usr/share/{man,doc,info,locale,tabset,terminfo} 2>/dev/null || true
          rm -rf usr/include 2>/dev/null || true
          find usr/lib/python* -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
          find usr/lib/python* -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find usr/lib/python* -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find usr/lib/python* -name "*.pyc" -delete 2>/dev/null || true
          rm -rf usr/lib/node_modules/npm/docs 2>/dev/null || true
          rm -rf usr/lib/node_modules/npm/html 2>/dev/null || true
          find usr/bin -type f -exec strip {} + 2>/dev/null || true
          find usr/lib -name "*.so" -exec strip {} + 2>/dev/null || true
          echo "=== Size after optimization ==="
          du -sh .

      - name: Create runtime archive
        run: |
          cd runtime
          tar czf ../runtime-arm64.tar.gz termux-prefix
          ls -lh ../runtime-arm64.tar.gz

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: runtime-archive
          path: runtime-arm64.tar.gz

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [build-go-server, build-frontend, package-runtimes]
    steps:
      - name: Download source code
        run: |
          curl -L "${{ env.SRC_ARCHIVE_URL }}" -o src.tar.gz
          mkdir -p workspace
          tar xzf src.tar.gz -C workspace

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: artifacts/go

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/web-dist

      - name: Download runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-archive
          path: artifacts/

      - name: Prepare assets
        run: |
          cd workspace
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a

          # Copy Go server binary as .dat file
          cp ../artifacts/go/daidai-server android-app/app/src/main/jniLibs/arm64-v8a/libdaidai-server.dat
          chmod +x android-app/app/src/main/jniLibs/arm64-v8a/libdaidai-server.dat

          # Package frontend dist as zip
          cd ../artifacts/web-dist
          zip -r ../../workspace/android-app/app/src/main/assets/web-dist.zip .
          cd ../../workspace

          # Copy runtime archive
          cp ../artifacts/runtime-arm64.tar.gz android-app/app/src/main/assets/

          ls -la android-app/app/src/main/assets/
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        working-directory: workspace/android-app
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Sign APK
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          APK_FILE=$(find workspace/android-app/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK_FILE"

          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore \
            -storepass android -keypass android \
            "$APK_FILE" androiddebugkey

          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -v 4 \
            "$APK_FILE" \
            daidai-panel-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daidai-panel-android-apk
          path: daidai-panel-android.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: daidai-panel-android.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
