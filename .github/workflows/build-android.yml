name: Build Android APK

on:
  push:
    tags:
      - 'v*'
      - 'v*.**'
  pull_request:
    paths:
      - 'android-app/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Panel version (e.g. 2.3.9). Used as fallback when not triggered by tag push.'
        required: false
        type: string
        default: 'dev'

# 防止同一 ref 二次触发并行 build 互相覆盖
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  # VERSION: tag push -> tag name; workflow_dispatch -> inputs.version; 否则 dev
  # 用引号包裹避免 YAML 把 && || 误解析
  VERSION: "${{ github.ref_name != 'main' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'dev' }}"

permissions:
  contents: write

jobs:
  build-go-server:
    name: Build Go Server (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        # 关键：固定 debug keystore 才能让用户覆盖安装
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Daidai Panel,C=US"
          fi
          ls -la ~/.android/debug.keystore

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build daidai-server for arm64
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go mod download
          go build -trimpath -ldflags="-s -w -X daidai-panel/handler.Version=${{ env.VERSION }}" \
            -o daidai-server .

      - name: Build ddp CLI for arm64
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o ddp ./cmd/ddp

      - name: Upload Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: |
            server/daidai-server
            server/ddp

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

  package-runtimes:
    name: Package Linux Sandbox Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - name: Cache Linux sandbox packages
        uses: actions/cache@v4
        with:
          path: sandbox-cache
          key: linux-sandbox-runtime-v1
          restore-keys: |
            linux-sandbox-runtime-

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: Download Linux sandbox runtime
        run: |
          mkdir -p sandbox-cache runtime/proot runtime/jni

          ALPINE_VERSION="3.21"
          ALPINE_RELEASE="3.21.3"
          ALPINE_URL="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/releases/aarch64/alpine-minirootfs-${ALPINE_RELEASE}-aarch64.tar.gz"
          if [ ! -f sandbox-cache/alpine-minirootfs.tar.gz ]; then
            curl -fSL "$ALPINE_URL" -o sandbox-cache/alpine-minirootfs.tar.gz
          fi
          cp sandbox-cache/alpine-minirootfs.tar.gz runtime/alpine-minirootfs.tar.gz

          if [ ! -f sandbox-cache/Packages ]; then
            curl -sL "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" | gunzip > sandbox-cache/Packages
          fi
          PROOT_FILE=$(awk '
            /^Package: / { p=$2 }
            /^Filename: / { if (p=="proot") print $2 }
          ' sandbox-cache/Packages | head -1)
          if [ -z "$PROOT_FILE" ]; then
            echo "::error::Unable to resolve Termux proot package"
            exit 1
          fi
          PROOT_DEB="sandbox-cache/$(basename "$PROOT_FILE")"
          if [ ! -f "$PROOT_DEB" ]; then
            curl -fSL "https://packages.termux.dev/apt/termux-main/$PROOT_FILE" -o "$PROOT_DEB"
          fi

          mkdir -p runtime/proot-extract
          dpkg-deb -x "$PROOT_DEB" runtime/proot-extract
          PROOT_BIN=$(find runtime/proot-extract -type f -name proot | head -1)
          if [ -z "$PROOT_BIN" ]; then
            echo "::error::Unable to find proot binary"
            exit 1
          fi
          cp "$PROOT_BIN" runtime/jni/libproot.so
          chmod +x runtime/jni/libproot.so

          LOADER64=$(find runtime/proot-extract -type f \( -name 'loader' -o -name '*loader.so' -o -name '*loader' \) | head -1 || true)
          LOADER32=$(find runtime/proot-extract -type f \( -name 'loader32' -o -name '*loader32*' \) | head -1 || true)
          if [ -z "$LOADER64" ] || [ -z "$LOADER32" ]; then
            echo "::error::Missing proot loader artifacts"
            find runtime/proot-extract -type f | sort
            exit 1
          fi
          cp "$LOADER64" runtime/jni/libproot-loader.so
          cp "$LOADER32" runtime/jni/libproot-loader32.so
          chmod +x runtime/jni/libproot-loader.so runtime/jni/libproot-loader32.so

          ls -lh runtime/alpine-minirootfs.tar.gz runtime/jni/

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: runtime-archive
          path: |
            runtime/alpine-minirootfs.tar.gz
            runtime/jni/*.so

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [build-go-server, build-frontend, package-runtimes]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        # 必须用同一个 key 才会命中之前的 cache，保证 APK 签名一致
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Daidai Panel,C=US"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: artifacts/go

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/web-dist

      - name: Download runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-archive
          path: artifacts/

      - name: Prepare assets
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a

          # Copy Go server binary as lib*.so so Android auto-extracts it to nativeLibraryDir
          cp artifacts/go/daidai-server android-app/app/src/main/jniLibs/arm64-v8a/libdaidai-server.so
          chmod +x android-app/app/src/main/jniLibs/arm64-v8a/libdaidai-server.so

          # Package frontend dist as zip
          cd artifacts/web-dist
          zip -r ../../android-app/app/src/main/assets/web-dist.zip .
          cd ../..

          # Copy Linux sandbox runtime
          ROOTFS_FILE=$(find artifacts -name alpine-minirootfs.tar.gz | head -1)
          if [ -z "$ROOTFS_FILE" ]; then
            echo "::error::Missing alpine-minirootfs.tar.gz"
            exit 1
          fi
          cp "$ROOTFS_FILE" android-app/app/src/main/assets/
          find artifacts -name '*.so' -exec cp {} android-app/app/src/main/jniLibs/arm64-v8a/ \;
          for required in libproot.so libproot-loader.so libproot-loader32.so; do
            if [ ! -f "android-app/app/src/main/jniLibs/arm64-v8a/$required" ]; then
              echo "::error::Missing sandbox native artifact: $required"
              exit 1
            fi
          done

          ls -la android-app/app/src/main/assets/
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        working-directory: android-app
        run: |
          cat gradle.properties
    gradle assembleDebug --no-daemon --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true -Pandroid.injected.signing.v1-enabled=true -Pandroid.injected.signing.v2-enabled=true -Pandroid.injected.signing.store.file=~/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

      - name: Zipalign APK
        run: |
          APK_FILE=$(find android-app/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK_FILE"
          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -f -v 4 \
            "$APK_FILE" \
            daidai-panel-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daidai-panel-android-apk
          path: daidai-panel-android.apk

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: daidai-panel-android.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
