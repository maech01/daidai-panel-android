name: Build Android APK

on:
  push:
    tags:
      - 'v*'
      - 'v*.**'
  pull_request:
    paths:
      - 'android-app/**'
      - 'server/**'
      - 'web/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Panel version (e.g. 2.3.9). Used as fallback when not triggered by tag push.'
        required: false
        type: string
        default: 'dev'

# 防止同一 ref 二次触发并行 build 互相覆盖
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  # VERSION: tag push -> tag name; workflow_dispatch -> inputs.version; 否则 dev
  # 用引号包裹避免 YAML 把 && || 误解析
  VERSION: "${{ github.ref_name != 'main' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version || 'dev' }}"

jobs:
  build-go-server:
    name: Build Go Server (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        # 关键：固定 debug keystore 才能让用户覆盖安装
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Daidai Panel,C=US"
          fi
          ls -la ~/.android/debug.keystore

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build daidai-server for arm64
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go mod download
          go build -trimpath -ldflags="-s -w -X daidai-panel/handler.Version=${{ env.VERSION }}" \
            -o daidai-server .

      - name: Build ddp CLI for arm64
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o ddp ./cmd/ddp

      - name: Upload Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: |
            server/daidai-server
            server/ddp

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

  package-runtimes:
    name: Package Termux Runtimes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - name: Cache Termux packages
        uses: actions/cache@v4
        with:
          path: termux-cache
          key: termux-packages-${{ hashFiles('scripts/download-termux.sh') }}
          restore-keys: |
            termux-packages-

      - name: Install dpkg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev patchelf

      - name: Download and extract Termux packages
        run: |
          mkdir -p termux-cache runtime/termux-prefix
          cd termux-cache

          # Download the Packages index
          if [ ! -f Packages ]; then
            curl -sL "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.gz" | \
              gunzip > Packages
          fi

          # Function to download a package and extract it
          download_pkg() {
            local pkgname=$1
            local filename=$(awk -v pkg="$pkgname" '
              /^Package: / { p=$2 }
              /^Filename: / { if (p==pkg) print $2 }
            ' Packages)
            if [ -n "$filename" ]; then
              local base=$(basename "$filename")
              if [ ! -f "$base" ]; then
                echo "  Downloading $pkgname..."
                curl -sL "https://packages.termux.dev/apt/termux-main/$filename" -o "$base"
              fi
              dpkg-deb -x "$base" ../runtime/termux-prefix/
            else
              echo "  WARNING: Package $pkgname not found in index"
            fi
          }

          # Download and extract all needed packages in dependency order
          for pkg in \
            libandroid-support \
            libc++ \
            ndk-sysroot \
            termux-exec \
            ca-certificates \
            libbz2 \
            libexpat \
            libffi \
            liblzma \
            libsqlite \
            libssl3 \
            libuuid \
            libxml2 \
            zlib \
            readline \
            sqlite \
            tcl \
            python \
            nodejs \
            bash \
            coreutils \
            findutils \
            grep \
            sed \
            tar \
            gzip \
            gawk \
            which; do
            download_pkg "$pkg"
          done

          echo "=== Extracted packages ==="
          ls -la ../runtime/termux-prefix/
          ls ../runtime/termux-prefix/usr/bin/ 2>/dev/null | head -30

      - name: Optimize runtime size
        run: |
          cd runtime/termux-prefix
          rm -rf usr/share/{man,doc,info,locale,tabset,terminfo} 2>/dev/null || true
          rm -rf usr/include 2>/dev/null || true
          find usr/lib/python* -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
          find usr/lib/python* -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find usr/lib/python* -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find usr/lib/python* -name "*.pyc" -delete 2>/dev/null || true
          rm -rf usr/lib/node_modules/npm/docs 2>/dev/null || true
          rm -rf usr/lib/node_modules/npm/html 2>/dev/null || true
          find usr/bin -type f -exec strip {} + 2>/dev/null || true
          find usr/lib -name "*.so" -exec strip {} + 2>/dev/null || true
          echo "=== Size after optimization ==="
          du -sh .

      - name: Create runtime archive
        run: |
          cd runtime
          tar czf ../runtime-arm64.tar.gz termux-prefix
          ls -lh ../runtime-arm64.tar.gz

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: runtime-archive
          path: runtime-arm64.tar.gz

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [build-go-server, build-frontend, package-runtimes]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Android debug keystore
        # 必须用同一个 key 才会命中之前的 cache，保证 APK 签名一致
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
          restore-keys: |
            android-debug-keystore-

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Daidai Panel,C=US"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: artifacts/go

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/web-dist

      - name: Download runtime archive
        uses: actions/download-artifact@v4
        with:
          name: runtime-archive
          path: artifacts/

      - name: Prepare assets
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a

          # Copy Go server binary as lib*.so so Android auto-extracts it to nativeLibraryDir
          cp artifacts/go/daidai-server android-app/app/src/main/jniLibs/arm64-v8a/libdaidai-server.so
          chmod +x android-app/app/src/main/jniLibs/arm64-v8a/libdaidai-server.so

          # Package frontend dist as zip
          cd artifacts/web-dist
          zip -r ../../android-app/app/src/main/assets/web-dist.zip .
          cd ../..

          # Copy runtime archive
          cp artifacts/runtime-arm64.tar.gz android-app/app/src/main/assets/

          ls -la android-app/app/src/main/assets/
          ls -la android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK
        working-directory: android-app
        run: |
          # 确保 gradle.properties 被正确读取
          cat gradle.properties
          # assembleDebug 已自动用 ~/.android/debug.keystore 签名（v1 签名）
          gradle assembleDebug --no-daemon --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Zipalign APK
        run: |
          APK_FILE=$(find android-app/app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK_FILE"
          ${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign -f -v 4 \
            "$APK_FILE" \
            daidai-panel-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daidai-panel-android-apk
          path: daidai-panel-android.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: daidai-panel-android.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
